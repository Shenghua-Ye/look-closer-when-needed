splits: {unit: image, dev_cal_test: [0.4, 0.3, 0.3], rounds: 5, round0: manifest split, seeds: {manifest: 20261001,
         rounds: 20261101, cal_sample: 20261102, test_sample: 20261103, f1_order: 20261104, f1_path_order: 20261105,
         bootstrap_replay: 20261106, timing_order_and_bootstrap: 20261107, human_eval_sample: 20261108}}
timing: {arms: [full, restart, resume], repeats: 3, statistic: per-request median, bootstrap: 2000 image-cluster resamples}
