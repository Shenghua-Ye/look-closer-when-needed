# Final study configuration (documentation of the constants the code uses; the code is the source of truth).
model: {id: llava-hf/llava-v1.6-vicuna-7b-hf, revision: c916e6cdcd760b4cecd1dd4907f84ac649f93b23, dtype: float16,
        attn: sdpa, batch_size: 1, greedy: true, max_new_tokens: 32}
paths:
  cheap: base view only, 336x336 bicubic, 577 visual tokens (models/llava_next.py)
  full: native AnyRes, 1,416-2,928 visual tokens
  fallback: resume from the shared prefix (text prefix + 576 base-view patches), crops + question prefilled, draft verified
